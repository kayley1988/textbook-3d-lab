<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<script>
/* 全局错误横幅：任何加载/运行错误都直接显示在页面上 */
window.addEventListener('error', e => {
  const msg = e.message || (e.target && (e.target.src || e.target.href)) || e.type || '未知错误';
  let d = document.getElementById('__err');
  if (!d) {
    d = document.createElement('div');
    d.id = '__err';
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c2401e;color:#fff;padding:10px 16px;font:12px/1.6 Consolas,monospace;white-space:pre-wrap;word-break:break-all';
    document.body.appendChild(d);
  }
  d.textContent += '[加载错误] ' + msg + '\n';
}, true);
</script>
<style>
:root{
  --paper:#f6f1e7;--paper-2:#efe7d6;--panel:#fffdf8;
  --ink:#2b2a26;--ink-2:#6b6558;--line:#e4dccb;--line-2:#d5cab2;
  --accent:#d96f1e;--accent-deep:#b5541a;--accent-soft:#fbeadb;
  --blue:#2f6fdb;--green:#2fa36b;--red:#e04b2f;
  --radius:14px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 78% -12%, #fdf9f0 0%, transparent 62%),
    linear-gradient(180deg,#f8f4ea 0%,#f1ead9 100%);
  overflow:hidden;
}
#app{height:100vh;display:flex}

/* ---------- 左侧讲解面板 ---------- */
.panel{
  width:352px;flex:0 0 352px;height:100%;overflow-y:auto;
  background:rgba(255,253,248,.94);
  border-right:1px solid var(--line);
  padding:22px 22px 40px;
  backdrop-filter:blur(8px);
}
.p-tag{
  display:inline-block;font:600 10.5px/1 inherit;letter-spacing:.14em;
  color:var(--accent-deep);background:var(--accent-soft);
  padding:5px 10px;border-radius:6px;margin-bottom:12px;text-transform:uppercase;
}
h1{font:700 23px/1.35 Georgia,"Songti SC",serif;letter-spacing:.01em;margin-bottom:10px}
.lead{font-size:13px;line-height:1.75;color:var(--ink-2);margin-bottom:20px}

.sec{margin-bottom:20px}
.sec-h{
  font:700 11px/1 inherit;letter-spacing:.16em;color:var(--ink-2);
  padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:11px;text-transform:uppercase;
}
.concept{font-size:13px;line-height:1.82;color:var(--ink)}
.concept p{margin-bottom:9px}
.concept b,.concept strong{color:var(--accent-deep)}
.concept em{font-style:normal;background:linear-gradient(transparent 62%, #ffe6c2 62%);padding:0 1px}

.formula{
  background:linear-gradient(180deg,#fffdf8,#fdf6ea);
  border:1px solid var(--line-2);border-radius:var(--radius);
  padding:16px 14px;text-align:center;
}
.formula .expr{
  font:600 21px/1.4 "Cambria",Georgia,serif;color:var(--ink);letter-spacing:.02em;
}
.formula .expr sub{font-size:.62em}
.formula .expr sup{font-size:.62em}
.formula .expr .op{color:var(--accent);padding:0 3px}
.formula .expr .var{font-style:italic;color:var(--blue)}
.formula .expr .hl{color:var(--accent-deep);font-weight:700}
.formula .note{
  font-size:11.5px;line-height:1.65;color:var(--ink-2);margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--line-2);
}

.points{list-style:none;font-size:12.5px;line-height:1.75}
.points li{position:relative;padding-left:16px;margin-bottom:7px;color:var(--ink-2)}
.points li::before{
  content:"";position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;
  background:var(--accent);
}

/* 控件 */
.ctrl{margin-bottom:13px}
.ctrl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.ctrl-l{font-size:12px;color:var(--ink-2)}
.ctrl-v{font:700 12.5px/1 ui-monospace,Consolas,monospace;color:var(--accent-deep)}
input[type=range]{
  -webkit-appearance:none;width:100%;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 50%,var(--paper-2) 50%);
  outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2.5px solid var(--accent);
  box-shadow:0 2px 6px rgba(180,90,20,.28);cursor:grab;
}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.08)}

.actions{display:flex;gap:8px;margin-top:14px}
.btn{
  flex:1;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  font:600 12.5px/1 inherit;padding:10px 8px;border-radius:10px;cursor:pointer;
  transition:all .16s;
}
.btn:hover{background:var(--paper-2);border-color:var(--accent)}
.btn-primary{background:var(--ink);color:#fdf6ea;border-color:var(--ink)}
.btn-primary:hover{background:#3d3a32}

/* 读数 */
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ro{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:8px 9px;display:flex;flex-direction:column;gap:2px;
}
.ro-l{font-size:10px;color:var(--ink-2);letter-spacing:.02em}
.ro-v{font:700 15px/1.1 ui-monospace,Consolas,monospace;color:var(--ink)}
.ro-v i{font-style:normal;font-size:9.5px;color:var(--ink-2);margin-left:2px;font-weight:400}

.think{
  background:linear-gradient(180deg,#fdf7ec,#fbf1df);
  border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:12.5px;line-height:1.7;color:var(--ink-2);
}

/* ---------- 右侧 3D 舞台 ---------- */
.stage-wrap{flex:1;position:relative;min-width:0}
#stage{position:absolute;inset:0}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.lab3d{
  position:absolute;left:0;top:0;
  font:600 12px/1.35 "PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:rgba(255,253,248,.95);
  border:1px solid var(--line);border-radius:8px;
  padding:4px 9px;white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 14px rgba(80,60,30,.13);
  transition:opacity .15s;
}
.lab3d .sub{display:block;font:400 10px/1.4 inherit;color:var(--ink-2);margin-top:1px}
.lab3d.dim{background:rgba(255,253,248,.82);color:var(--ink-2);font-weight:400;font-size:11px}
.lab3d.hl{background:var(--ink);color:#fdf6ea;border-color:var(--ink)}
.lab3d.hl .sub{color:#cfc5b0}

.hint{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  font-size:11.5px;color:var(--ink-2);background:rgba(255,253,248,.88);
  border:1px solid var(--line);border-radius:20px;padding:6px 15px;
  backdrop-filter:blur(6px);white-space:nowrap;
}

@media (max-width:840px){
  #app{flex-direction:column}
  .panel{width:100%;flex:0 0 auto;max-height:44vh;border-right:none;border-bottom:1px solid var(--line)}
  .stage-wrap{flex:1;min-height:56vh}
  .readouts{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside class="panel" id="panel"></aside>
  <main class="stage-wrap">
    <div id="stage"></div>
    <div id="labels"></div>
    <div class="hint">🖱 左键拖拽旋转 · 滚轮缩放 · 右键平移</div>
  </main>
</div>

<script type="importmap">{{IMPORTMAP_JSON}}</script>
<script type="module">
import * as THREE from 'three';

/* ================= 运行时（由构建脚本内联） ================= */
{{LAB}}

/* ================= 场景（由生成器写入） ================= */
{{SCENE}}

/* ================= 启动 ================= */
const $ = id => document.getElementById(id);
const stage = createStage($('stage'), $('labels'));
const { scene, camera, controls } = stage;

/* --- 左侧面板 --- */
function panelHTML(m) {
  const esc = s => String(s ?? '');
  return `
    ${m.tag ? `<div class="p-tag">${esc(m.tag)}</div>` : ''}
    <h1>${esc(m.title)}</h1>
    ${m.lead ? `<p class="lead">${esc(m.lead)}</p>` : ''}
    ${m.concept ? `<section class="sec"><div class="sec-h">概念</div><div class="concept">${m.concept}</div></section>` : ''}
    ${m.formula ? `<section class="sec"><div class="sec-h">核心公式</div>
      <div class="formula"><div class="expr">${m.formula.expr || ''}</div>
      ${m.formula.note ? `<div class="note">${m.formula.note}</div>` : ''}</div></section>` : ''}
    ${m.points?.length ? `<section class="sec"><div class="sec-h">要点</div>
      <ul class="points">${m.points.map(p => `<li>${p}</li>`).join('')}</ul></section>` : ''}
    ${m.controls?.length ? `<section class="sec"><div class="sec-h">动手调一调</div>
      <div id="ctrls"></div>
      <div class="actions"><button class="btn btn-primary" id="btnPlay">▶ 开始</button>
      <button class="btn" id="btnReset">↺ 重置</button></div></section>` : ''}
    <section class="sec"><div class="sec-h">实时读数</div><div class="readouts" id="readouts"></div></section>
    ${m.question ? `<section class="sec"><div class="sec-h">想一想</div>
      <div class="think">${m.question}</div></section>` : ''}
  `;
}
$('panel').innerHTML = panelHTML(meta);

/* --- 滑块 --- */
const P = {};
(meta.controls || []).forEach(c => {
  P[c.key] = c.value ?? c.min;
  const wrap = document.createElement('div');
  wrap.className = 'ctrl';
  wrap.innerHTML = `
    <div class="ctrl-top"><span class="ctrl-l">${c.label}</span>
      <span class="ctrl-v" id="v_${c.key}">${P[c.key]}${c.unit || ''}</span></div>
    <input type="range" id="s_${c.key}" min="${c.min}" max="${c.max}" step="${c.step || 0.01}" value="${P[c.key]}">`;
  $('ctrls').appendChild(wrap);
  const input = wrap.querySelector('input');
  const lab = wrap.querySelector(`#v_${c.key}`);
  input.addEventListener('input', () => {
    P[c.key] = parseFloat(input.value);
    lab.textContent = P[c.key] + (c.unit || '');
    paintRange(input);
    if (impl.onParam) impl.onParam(P);
    refresh();
  });
  paintRange(input);
});
function paintRange(el) {
  const pct = (el.value - el.min) / (el.max - el.min) * 100;
  el.style.background = `linear-gradient(90deg,var(--accent) ${pct}%,var(--paper-2) ${pct}%)`;
}

/* --- 场景实例 --- */
const setReadouts = createReadouts($('readouts'));
const impl = create({ visual: stage, scene, camera, controls, addLabel: stage.addLabel, setReadouts, meta }) || {};
function refresh() {
  if (impl.readouts) setReadouts(impl.readouts(P));
}
refresh();
if (meta.cam) {
  camera.position.set(...meta.cam.pos);
  controls.target.set(...meta.cam.target);
  camera.lookAt(controls.target);
  controls.sync();
}
autoFrame(camera, controls, scene, { pad: 1.16 });

$('btnPlay')?.addEventListener('click', () => impl.play && impl.play(P));
$('btnReset')?.addEventListener('click', () => {
  impl.reset && impl.reset(P);
  refresh();
});

/* --- 主循环 --- */
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  controls.update();
  if (impl.update) impl.update(dt, P);
  stage.updateLabels();
  stage.renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
